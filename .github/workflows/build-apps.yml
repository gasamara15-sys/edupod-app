name: Build EduPod Android & iOS Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. Android APK 자동 생성 및 빌드
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Project Scaffolding
        run: |
          flutter create . --org com.edupod --project-name edupod --platforms=android
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EduPod-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

  # 2. iOS 프로젝트 자동 생성 및 무서명 빌드
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate iOS Project Scaffolding
        run: |
          flutter create . --org com.edupod --project-name edupod --platforms=ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Runner.app to IPA
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r EduPod-iOS.ipa Payload

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: EduPod-iOS-Unsigned-IPA
          path: build/ios/iphoneos/EduPod-iOS.ipa
