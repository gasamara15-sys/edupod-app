name: Build EduPod Apps

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # 1. Android APK 빌드 (푸시 알림 포함)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure Android & Dependencies
        run: |
          rm -rf android
          flutter create . --org com.edupod --project-name edupod --platforms=android
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml
          flutter pub add webview_flutter onesignal_flutter

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EduPod-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk

  # 2. iOS 번들 빌드
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Configure iOS & Dependencies
        run: |
          rm -rf ios
          flutter create . --org com.edupod --project-name edupod --platforms=ios
          flutter pub add webview_flutter onesignal_flutter

      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS Runner
        run: |
          cd build/ios/iphoneos
          zip -r EduPod-iOS-Runner.zip Runner.app

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EduPod-iOS-Package
          path: build/ios/iphoneos/EduPod-iOS-Runner.zip
